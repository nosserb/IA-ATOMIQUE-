name: Bug Report
description: File a bug report
title: "[BUG]: "
labels: ["bug"]
assignees:
  - 

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear and concise description of the bug
      placeholder: What happened?
    validations:
      required: true
  
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: How to reproduce the issue
      placeholder: |
        1. Run `./programme ...`
        2. Input ...
        3. See error ...
    validations:
      required: true
  
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen instead
      placeholder: Expected output or behavior
    validations:
      required: true
  
  - type: textarea
    id: logs
    attributes:
      label: Logs/Output
      description: Relevant error messages or output
      render: bash
  
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  
  - type: input
    id: go-version
    attributes:
      label: Go Version
      placeholder: "1.22.0"
    validations:
      required: true
  
  - type: input
    id: ia-version
    attributes:
      label: IA-ATOMIQUE Version
      placeholder: "5.2.0"
    validations:
      required: true
  
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other relevant information
      placeholder: Screenshots, configurations, etc.
