<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA-ATOMIQUE - Résumeur de Texte</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 IA-ATOMIQUE</h1>
            <p>Résumeur de Texte Intelligent</p>
        </div>

        <div class="main-content">
            <div class="input-section">
                <h2>Votre Texte</h2>
                <textarea id="inputText" placeholder="Collez votre texte ici..."></textarea>
                <button id="summarizeBtn" onclick="summarizeText()">Résumer</button>
            </div>

            <div class="output-section">
                <h2>Résumé</h2>
                <div id="outputText" class="output-box">
                    <p class="placeholder">Le résumé apparaîtra ici...</p>
                </div>
                <div id="stats" class="stats"></div>
            </div>
        </div>

        <div class="footer">
            <p>IA-ATOMIQUE v4.2 - Analyse Neuronale</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
